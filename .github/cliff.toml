# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "hxreborn"
repo = "amznkiller"

[changelog]
header = ""
body = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- macro commit(commit) -%}
- [`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}) \
  {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
  {{ commit.message | upper_first | trim }}\
  {% if commit.breaking %} [**breaking**]{% endif %}\
  {% if commit.remote.username %} by @{{ commit.remote.username }}\
  {%- if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}{% endif %}
{%- for footer in commit.footers %}
{%- if footer.token not in ["Signed-off-by", "Co-authored-by", "Closes", "Fixes", "Resolves"] %}

  > {{ footer.token }}{{ footer.separator }}{{ footer.value }}
{%- endif %}
{%- endfor %}
{% endmacro -%}

## What's Changed
{% set_global closed = [] -%}
{% for commit in commits -%}
{% for footer in commit.footers -%}
{% if footer.token in ["Closes", "Fixes", "Resolves"] -%}
{% set_global closed = closed | concat(with="#" ~ footer.value) -%}
{% endif -%}
{% endfor -%}
{% endfor -%}
{% if closed | length > 0 %}
Closes {{ closed | unique | join(sep=", ") }}
{% endif %}
{% if commits | length == 0 -%}
No user-facing changes in this release.
{%- else %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
{{ self::commit(commit=commit) }}
{%- endfor -%}
{% for commit in commits %}
{%- if not commit.scope %}
{{ self::commit(commit=commit) }}
{%- endif -%}
{%- endfor %}
{% endfor %}
{%- endif %}

"""
footer = ""
trim = false
postprocessors = [
  { pattern = ' +\n', replace = "\n" },
  { pattern = 'by @hxreborn in \[#71\]', replace = "by @dependabot[bot] in [#71]" },
]

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { sha = "45c87d2726ec6ca9c84268dffb726834fd8083bc", skip = true },
  { sha = "421356e40ac8ea83ae724e72d6ff76a0a2648169", skip = true },
  { sha = "7339348db2435b5e02b746321f49f2b4de97ee71", skip = true },
  { sha = "3c1afc26b70b1b493cf15b20b5c0b3d0057ac6ed", skip = true },
  { sha = "0fb49800bc167befb1989a84794df198ac894c92", skip = true },
  { sha = "57f5801d1abc6d172f7729fe2bf522274a29bf26", skip = true },
  { sha = "4cad07416700223b151a34c06d619289c20a1e68", skip = true },
  { sha = "a6762ba49e8d160ada52a76e98aba7b1c7e750e8", skip = true },
  { sha = "8b8ccfe379f10af443694e656ca0555770092f66", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^[fF]ix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance Improvements" },
  { message = "^security", group = "<!-- 03 -->Security" },
  { body = ".*[Ss]ecurity", group = "<!-- 03 -->Security" },
  { message = "^refactor", group = "<!-- 04 -->Refactor" },
  { message = "^[Rr]evert", group = "<!-- 05 -->Reverts" },
  { message = '^(build|chore|ci)\(deps(-dev)?\)', group = "<!-- 08 -->Dependencies" },
  { message = "^doc", skip = true },
  { message = "^style", skip = true },
  { message = "^build", group = "<!-- 09 -->Build" },
  { message = "^ci", skip = true },
  { message = "^test", group = "<!-- 11 -->Tests" },
  # Mute release/changelog noise only
  { message = '^chore(\(release\))?:\s*(release|prepare|bump|align|v?\d+\.\d+)', skip = true },
  { message = '^release:\s*(bump|prepare|v?\d+\.\d+)', skip = true },
  { message = '^chore\(changelog\)', skip = true },
  # Catch-all
  { message = ".*", group = "<!-- 99 -->Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
